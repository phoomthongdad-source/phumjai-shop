<style>
  :root{
    --bg: #131213;
    --bg-elev: #262425;
    --bg-elev-2: #3B3939;
    --border: #535353;
    --border-soft: rgba(116,117,118,0.35);
    --text: #FCFAFC;
    --text-dim: #B0B1B3;
    --text-faint: #8B8D8E;
    --accent: #FCFAFC;
    --accent-dim: #747576;
    --accent-soft: rgba(252,250,252,0.16);
    --rust: #C2C6C1;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 8px 30px rgba(0,0,0,0.45);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(1200px 600px at 50% -10%, #1d1c1d 0%, var(--bg) 55%) fixed;
    color: var(--text);
    font-family: 'Prompt', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a{ color: inherit; }
  img{ max-width: 100%; display:block; }
  button{ font-family: inherit; cursor: pointer; }

  .topbar{
    position: sticky; top:0; z-index: 30;
    background: rgba(13,15,19,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px calc(14px + env(safe-area-inset-top, 0px)*0);
  }
  .topbar-inner{
    max-width: 960px; margin: 0 auto;
    display:flex; align-items:center; gap:10px;
  }
  .logo{
    width:40px; height:40px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .logo img{ width:100%; height:100%; object-fit:contain; display:block; }
  .brand-block{ flex:1; min-width:0; }
  .brand-name{ font-weight:600; font-size: 18px; letter-spacing: 0.3px; }
  .brand-tag{ font-size: 11px; color: var(--text-faint); margin-top:1px; }
  .help-btn{
    width:34px; height:34px; flex-shrink:0; border-radius:50%;
    background: var(--bg-elev); border:1px solid var(--border); color: var(--text-dim);
    display:flex; align-items:center; justify-content:center;
  }
  .help-btn:hover{ color: var(--text); border-color: var(--accent-dim); }
  .help-panel{
    max-width: 960px; margin: 10px auto 0;
  }
  .help-panel-inner{
    display:flex; align-items:flex-start; gap:10px;
    background: var(--bg-elev); border:1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; box-shadow: var(--shadow);
  }
  .help-panel-inner p{ flex:1; margin:0; font-size:13px; color: var(--text-dim); line-height:1.6; }
  .help-panel-close{
    flex-shrink:0; color: var(--text-faint); background:none; border:none; padding:2px;
    display:flex; align-items:center; justify-content:center;
  }
  .help-panel-close:hover{ color: var(--text); }

  .container{ max-width: 960px; margin: 0 auto; padding: 18px 14px 0; }

  .hero{ padding: 6px 2px 14px; }
  .hero h1{ font-size: 21px; font-weight: 600; margin: 0 0 4px; }
  .hero p{ font-size: 13.5px; color: var(--text-dim); margin:0; line-height:1.6; }

  .featured{ margin: 4px 0 18px; }
  .featured-head{
    font-size: 12px; font-weight:700; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--text-faint); margin: 0 2px 8px;
  }
  .featured-row{
    display:flex; gap: 12px; overflow-x:auto; padding-bottom:4px; scroll-snap-type: x proximity;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .featured-row::-webkit-scrollbar{ display:none; }
  .featured-item{ flex: 0 0 148px; width:148px; scroll-snap-align: start; }
  .featured-item .card-name{ font-size: 12.5px; }
  .featured-item .card-desc{ display:none; }
  @media (min-width: 560px){ .featured-item{ flex-basis:170px; width:170px; } }

  .cat-nav{ margin: 0 0 16px; }
  .cat-row{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .cat-row::-webkit-scrollbar{ display:none; }
  .cat-row-sub{ margin-top:8px; }
  .cat-chip{

// ---- ค่าส่งและ PromptPay ----
const PROMPTPAY_ID = "0983495551";
const PROMPTPAY_NAME = "ภูมิพัฒน์ ทองดาษ";
const SHIPPING_METHOD_LABELS = { flash: "Flash Express", ems: "EMS", pickup: "นัดรับสินค้าหน้าร้าน" };

function formatPromptPayId(id){
  const digits = String(id).replace(/[^0-9]/g, "");
  if (digits.length === 10) return digits.replace(/(\d{3})(\d{3})(\d{4})/, "$1-$2-$3");
  return digits;
}

// คำนวณ CRC16 (CCITT-FALSE, init 0xFFFF) ตามมาตรฐาน EMVCo QR ที่ PromptPay ใช้
function crc16Ccitt(str){
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++){
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++){
      if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
      else crc <<= 1;
      crc &= 0xFFFF;
    }
  }
  return ("0000" + crc.toString(16).toUpperCase()).slice(-4);
}

function tlv(id, value){
  return id + ("00" + String(value.length)).slice(-2) + value;
}

// แปลงเบอร์โทร/เลขบัตรประชาชน ให้อยู่ในฟอร์แมตที่ PromptPay QR ต้องใช้ (ตามสเปค EMVCo/ธปท.)
function formatPromptPayTarget(id){
  const numbers = String(id).replace(/[^0-9]/g, "");
  if (numbers.length >= 13) return numbers;
  return ("0000000000000" + numbers.replace(/^0/, "66")).slice(-13);
}

// สร้าง payload ของ QR PromptPay แบบฝังยอดเงิน (dynamic) — คำนวณล้วนฝั่ง client ไม่ต้องพึ่ง backend/บริการภายนอก
function buildPromptPayPayload(target, amount){
  const merchantInfo = tlv("00", "A000000677010111") + tlv(target.replace(/[^0-9]/g, "").length >= 13 ? "02" : "01", formatPromptPayTarget(target));
  const parts = [
    tlv("00", "01"),
    tlv("01", amount ? "12" : "11"),
    tlv("29", merchantInfo),
    tlv("58", "TH"),
    tlv("53", "764"),
  ];
  if (amount) parts.push(tlv("54", Number(amount).toFixed(2)));
  const dataToCrc = parts.join("") + "6304";
  return dataToCrc + crc16Ccitt(dataToCrc);
}

// สร้าง QR PromptPay เป็น data URL (PNG-like, จริงๆ เป็น GIF) — ใช้ไลบรารี qrcode ที่ฝังไว้ในหน้านี้
function promptPayQrDataUrl(amount){
  const payload = buildPromptPayPayload(PROMPTPAY_ID, amount);
  const qr = window.qrcode(0, "M");
  qr.addData(payload);
  qr.make();
  return qr.createDataURL(8, 8);
}

// คำนวณค่าส่งจากน้ำหนักรวม (กรัม) ตามตารางเรทที่แอดมินตั้งไว้ (shop_shipping_rates)
function computeShippingCost(method, weightG, rates){
  if (method === "pickup") return 0;
  const tiers = (rates || [])
    .filter(r => r.method === method)
    .sort((a, b) => (a.min_weight_g || 0) - (b.min_weight_g || 0));
  const match = tiers.find(r => weightG >= (r.min_weight_g || 0) && (r.max_weight_g == null || weightG <= r.max_weight_g));
  if (match) return Number(match.price) || 0;
  if (tiers.length) return Number(tiers[tiers.length - 1].price) || 0;
  return 0;
}

function formatGrams(g){
  return (Number(g) || 0).toLocaleString("th-TH");
}

function formatBaht(n){
  const num = Number(n) || 0;
  return "฿" + num.toLocaleString("th-TH", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function formatDateTime(){
  return new Date().toLocaleString("th-TH", {

// ---- ส่งคำสั่งซื้อ (ที่อยู่ + สลิปโอนเงิน) เข้าอีเมลร้านโดยอัตโนมัติ ผ่าน Supabase Edge Function ----
const SEND_ORDER_EMAIL_URL = `${SUPABASE_URL}/functions/v1/send-order-email`;

// ย่อรูปสลิปการโอนเงินก่อนส่ง เพื่อให้ไฟล์แนบไม่ใหญ่เกินไป แต่ยังคงชัดพอให้อ่านยอด/เวลาบนสลิปได้
function compressSlipImage(file, maxDim = 1400, quality = 0.85){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim){
          if (width > height){ height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// ส่งคำสั่งซื้อ (รายการสินค้า + ที่อยู่จัดส่ง + รูปสลิป) ไปที่อีเมลร้านผ่าน Edge Function (send-order-email)
async function sendOrderEmail({ items, total, shippingInfo, shippingCost, slipDataUrl, slipFilename }){
  const res = await fetch(SEND_ORDER_EMAIL_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    },
    body: JSON.stringify({
      name: shippingInfo.name,
      phone: shippingInfo.phone,
      address: shippingInfo.address,
      note: shippingInfo.note,
      method: shippingInfo.method,
      shippingCost,
      total,
      grandTotal: total + shippingCost,
      items: items.map(it => ({ name: it.name, qty: it.qty, price: it.price })),
      slipBase64: slipDataUrl,
      slipFilename: slipFilename || "payment-slip.jpg",
    }),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok || json.error){
    throw new Error(json.error || "ส่งข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง");
  }
  return json;
}

// สินค้าที่เพิ่งกดเพิ่มเข้าระบบภายใน 24 ชั่วโมง ถือว่า "ใหม่" — คำนวณอัตโนมัติจาก created_at ไม่ต้องตั้งค่าเอง
const NEW_WITHIN_HOURS = 24;
function isProductNew(product){
  if (!product.created_at) return false;
  const ageMs = Date.now() - new Date(product.created_at).getTime();
  return ageMs >= 0 && ageMs <= NEW_WITHIN_HOURS * 60 * 60 * 1000;
}

function QuickAddModal({ product, cart, onConfirm, onClose }){
  const hasOptions = Array.isArray(product.options) && product.options.length > 0;
  const [selectedOptionId, setSelectedOptionId] = useState(hasOptions ? product.options[0].id : null);
  const selectedOption = hasOptions ? product.options.find(o => o.id === selectedOptionId) : null;
  const effectivePrice = hasOptions ? (Number(selectedOption && selectedOption.price) || 0) : (Number(product.price) || 0);
  const effectiveStock = hasOptions ? (selectedOption ? (Number(selectedOption.stock_qty) || 0) : 0) : (product.stock_qty ?? 0);
  const outOfStock = effectiveStock <= 0;
  const cartKey = hasOptions ? (product.id + "::" + selectedOptionId) : String(product.id);

  const [qty, setQty] = useState(0);
  useEffect(() => {
    const existing = cart[cartKey] || 0;
    setQty(outOfStock ? 0 : (existing > 0 ? existing : 1));
  }, [cartKey]);

  const atMax = qty >= effectiveStock;
  const optionImage = (hasOptions && selectedOption && selectedOption.image_url) ? selectedOption.image_url : null;
  const images = optionImage
    ? [optionImage]
    : ((Array.isArray(product.image_urls) && product.image_urls.length)
      ? product.image_urls
      : (product.image_url ? [product.image_url] : []));
  const [imgIdx, setImgIdx] = useState(0);
  useEffect(() => { setImgIdx(0); }, [selectedOptionId]);
  const showGalleryNav = images.length > 1;
  const prevImg = () => setImgIdx(i => (i - 1 + images.length) % images.length);
  const nextImg = () => setImgIdx(i => (i + 1) % images.length);
  const dec = () => setQty(q => Math.max(0, q - 1));
  const inc = () => setQty(q => Math.min(effectiveStock, q + 1));
  const handleConfirm = () => { onConfirm(product, qty, selectedOption); onClose(); };

  return (
    <div className="modal-overlay modal-overlay-center" onClick={onClose}>
      <div className="modal quickadd-modal" onClick={e => e.stopPropagation()}>
        <button type="button" className="modal-x" onClick={onClose} aria-label="ปิด"><IconClose /></button>
        <div className="quickadd-img">
          {outOfStock && <div className="badge-out">สินค้าหมด</div>}
          {product.is_bestseller && <div className="badge-tag badge-bestseller">ขายดี</div>}
          {!product.is_bestseller && isProductNew(product) && <div className="badge-tag badge-new">ใหม่</div>}
          {images.length
            ? <img src={images[imgIdx]} alt={product.name} />
            : <img className="placeholder" src={LOGO_URI} alt="" />}
          {showGalleryNav && (
            <React.Fragment>
              <button type="button" className="img-nav img-nav-prev" onClick={prevImg} aria-label="รูปก่อนหน้า"><IconChevronLeft /></button>
              <button type="button" className="img-nav img-nav-next" onClick={nextImg} aria-label="รูปถัดไป"><IconChevronRight /></button>
              <div className="img-dots">
                {images.map((_, i) => (
                  <span key={i} className={"img-dot" + (i === imgIdx ? " active" : "")} />
                ))}
              </div>
            </React.Fragment>
          )}
        </div>
        <div className="quickadd-body">
          <div className="quickadd-name">{product.name}</div>
          {product.description && <div className="quickadd-desc">{product.description}</div>}

          {hasOptions && (
            <div className="option-group">
              <div className="option-group-label">{product.option_group_name || "ตัวเลือก"}</div>
              <div className="option-chips">
                {product.options.map(o => {
                  const stock = Number(o.stock_qty) || 0;
                  return (
                    <button
                      type="button"
                      key={o.id}
                      className={"option-chip" + (o.id === selectedOptionId ? " active" : "") + (stock <= 0 ? " disabled" : "")}
                      onClick={() => setSelectedOptionId(o.id)}
                      disabled={stock <= 0}
                    >
                      {o.label}{stock <= 0 ? " (หมด)" : ""}
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          <div className="card-price-row">
            <div className="card-price">{formatBaht(effectivePrice)}</div>
            {!outOfStock && <div className="card-stock">เหลือ {effectiveStock} ชิ้น</div>}
          </div>
          <div className="quickadd-actions">
            <div className="stepper stepper-lg">
              <button onClick={dec} disabled={qty <= 0}>−</button>
              <span className="qty">{qty}</span>
              <button onClick={inc} disabled={outOfStock || atMax}>+</button>
            </div>
            <button type="button" className="btn-confirm" onClick={handleConfirm} disabled={outOfStock} aria-label="ยืนยันเพิ่มลงตะกร้า" title="ยืนยันเพิ่มลงตะกร้า">
              <IconCheck />
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function OrderModal({ items, total, shippingInfo, shippingCost, qrDataUrl, onClose, onSent }){
  const fileInputRef = useRef(null);
  const [slip, setSlip] = useState(null);
  const [slipName, setSlipName] = useState("");
  const [slipBusy, setSlipBusy] = useState(false);

  const [sendState, setSendState] = useState(null); // null | "success" | "error"
  const [sendErrorMsg, setSendErrorMsg] = useState("");
  const grandTotal = total + shippingCost;

  const openFilePicker = () => { if (fileInputRef.current) fileInputRef.current.click(); };

  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setSlipBusy(true);
    try {
      const dataUrl = await compressSlipImage(file);
      setSlip(dataUrl);
      setSlipName(file.name || "payment-slip.jpg");
    } catch (err) {
      console.error(err);
    }
    setSlipBusy(false);
  };

  const removeSlip = () => { setSlip(null); setSlipName(""); };

  const handleSend = async () => {
    if (!slip || sending) return;
    setSending(true);
    setSendErrorMsg("");
    try {
      await sendOrderEmail({ items, total, shippingInfo, shippingCost, slipDataUrl: slip, slipFilename: slipName });
      setSendState("success");
      if (onSent) onSent();
    } catch (err) {
      setSendState("error");
      setSendErrorMsg(err && err.message ? err.message : "ส่งข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง");
    }
    setSending(false);
  };

  return (
    <div className="modal-overlay modal-overlay-center" onClick={onClose}>
      <div className="modal order-modal" onClick={e => e.stopPropagation()}>
        <h2>สรุปคำสั่งซื้อของคุณ</h2>

        {sendState === "success" ? (
          <div className="state-box order-sent-box">
            <IconCheck />
            <div>ส่งที่อยู่จัดส่งและรูปสลิปให้ร้านทางอีเมลเรียบร้อยแล้ว ทางร้านจะตรวจสอบแล้วติดต่อกลับเพื่อจัดส่งสินค้า</div>
          </div>
        ) : (
          <React.Fragment>
            <div className="order-list">
              {items.map(it => (
                <div className="order-list-row" key={it.id}>
                  <span>{it.name} x{it.qty}</span>
                  <span>{formatBaht(it.price * it.qty)}</span>
                </div>
              ))}
            </div>

            <div className="order-address-block">
              <div className="order-address-label">{shippingInfo.method === "pickup" ? "รับสินค้าที่หน้าร้าน" : "จัดส่งไปที่"}</div>
              <div className="order-address-name">{shippingInfo.name} · {shippingInfo.phone}</div>
              {shippingInfo.method !== "pickup" && <div className="order-address-text">{shippingInfo.address}</div>}
              {shippingInfo.note && (
                <div className="order-address-note">{shippingInfo.method === "pickup" ? "นัดรับ: " : "หมายเหตุ: "}{shippingInfo.note}</div>
              )}
            </div>

            <div className="order-cost-row">
              <span>ค่าส่ง ({SHIPPING_METHOD_LABELS[shippingInfo.method]})</span>
              <span>{shippingInfo.method === "pickup" ? "ฟรี" : formatBaht(shippingCost)}</span>
            </div>
            <div className="cart-summary">
              <div className="label">ยอดรวมทั้งหมด</div>
              <div className="value">{formatBaht(grandTotal)}</div>
            </div>

            <div className="qr-section">
              <div className="qr-section-label">QR PromptPay</div>
              <div className="qr-box">
                {qrDataUrl && <img src={qrDataUrl} alt="QR PromptPay" />}
              </div>
              <div className="qr-caption">{formatPromptPayId(PROMPTPAY_ID)} · {PROMPTPAY_NAME}</div>
            </div>

            <div className="field field-center">
              <label>อัปโหลดรูปสลิปการชำระเงิน *</label>
              <input
                ref={fileInputRef}
                type="file"
                accept="image/*"
                className="visually-hidden"
                onChange={handleFile}
                disabled={slipBusy}
              />
              {slip ? (
                <div className="slip-preview">
                  <img src={slip} alt="สลิปการชำระเงิน" />
                  <button type="button" className="slip-remove" onClick={removeSlip} aria-label="ลบรูปสลิป"><IconClose /></button>
                </div>
              ) : (
                <button type="button" className="upload-slip-btn" onClick={openFilePicker} disabled={slipBusy}>
                  <IconUpload /> {slipBusy ? "กำลังประมวลผลรูป..." : "แนบรูปสลิป"}
                </button>
              )}
            </div>

            <div className="modal-note">
              <IconPin />
              <span>สแกน QR PromptPay ด้านบนเพื่อชำระเงินให้ครบยอด แนบรูปสลิปที่โอนแล้วด้านล่าง จากนั้นกด "ส่งข้อมูลให้ร้าน" ระบบจะส่งที่อยู่จัดส่งพร้อมรูปสลิปเข้าอีเมลร้านให้อัตโนมัติ</span>
            </div>

            {sendState === "error" && (
              <div className="modal-note modal-note-err">
                <IconWarning />
                <span>{sendErrorMsg}</span>
              </div>
            )}
          </React.Fragment>
        )}

        <div className="modal-actions">
          <button className="btn-secondary" onClick={onClose}>ปิด</button>
          {sendState !== "success" && (
            <button className="btn-primary" onClick={handleSend} disabled={!slip || sending}>
              {sending ? "กำลังส่ง..." : "ส่งข้อมูลให้ร้าน"}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [products, setProducts] = useState([]);
  const [categories, setCategories] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [cart, setCart] = useState({});
  const [modalOpen, setModalOpen] = useState(false);
  const [selectedMain, setSelectedMain] = useState(null);
  const [selectedSub, setSelectedSub] = useState(null);
  const [showHelp, setShowHelp] = useState(false);
  const [quickAddProduct, setQuickAddProduct] = useState(null);
  const [cartOpen, setCartOpen] = useState(false);
  const [checkoutOpen, setCheckoutOpen] = useState(false);
  const [shippingRates, setShippingRates] = useState([]);
  const [shippingInfo, setShippingInfo] = useState({ name: "", phone: "", address: "", note: "", method: "flash" });

  useEffect(() => {
    let active = true;
    (async () => {
      setLoading(true);
      setError(null);
      const [prodRes, catRes, shipRes] = await Promise.all([
        sb.from("shop_products").select("*").order("created_at", { ascending: true }),
        sb.from("shop_categories").select("*").order("sort_order", { ascending: true }),
        sb.from("shop_shipping_rates").select("*"),
      ]);
      if (!active) return;
      if (prodRes.error){
        setError("โหลดสินค้าไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง");
      } else {
        setProducts(prodRes.data || []);
      }
      if (!catRes.error){
        setCategories(catRes.data || []);
      }
      if (!shipRes.error){
        setShippingRates(shipRes.data || []);
      }
      setLoading(false);
    })();
    return () => { active = false; };
  }, []);

  const mainCategories = useMemo(() => categories.filter(c => !c.parent_id), [categories]);
  const subCategoriesByParent = useMemo(() => {
    const map = {};
    categories.filter(c => c.parent_id).forEach(c => {
      (map[c.parent_id] = map[c.parent_id] || []).push(c);
    });
    return map;
  }, [categories]);

  const activeSubCategories = selectedMain ? (subCategoriesByParent[selectedMain.id] || []) : [];

  const filteredProducts = useMemo(() => {
    if (!selectedMain) return products;
    if (selectedSub) return products.filter(p => p.category_id === selectedSub.id);
    const allowedIds = new Set([selectedMain.id, ...activeSubCategories.map(c => c.id)]);
    return products.filter(p => p.category_id && allowedIds.has(p.category_id));
  }, [products, selectedMain, selectedSub, activeSubCategories]);

  const pickMain = (cat) => { setSelectedMain(cat); setSelectedSub(null); };

  // แถบ "แนะนำ" แสดงเฉพาะสินค้าขายดี (ตั้งค่าโดยแอดมิน) — สินค้าใหม่ยังคงมีป้าย "ใหม่" บนการ์ดปกติ แต่ไม่โผล่ในแถบนี้
  const featuredProducts = useMemo(() => {
    return products
      .filter(p => p.is_bestseller)
      .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
      .slice(0, 12);
  }, [products]);

  // ตะกร้าเก็บด้วย key: "<productId>" (สินค้าไม่มีตัวเลือก) หรือ "<productId>::<optionId>" (สินค้ามีตัวเลือก)
  // เพื่อให้สินค้าตัวเดียวกันคนละตัวเลือก (เช่น ไซซ์ต่างกัน) นับเป็นรายการแยกกันในตะกร้า
  const cartKeyFor = (productId, optionId) => optionId ? (productId + "::" + optionId) : String(productId);

  const incByKey = (key, stockQty) => {
    setCart(prev => {
      const cur = prev[key] || 0;
      if (cur >= stockQty) return prev;
      return { ...prev, [key]: cur + 1 };
    });
  };
  const decByKey = (key) => {
    setCart(prev => {
      const cur = prev[key] || 0;
      if (cur <= 0) return prev;
      const next = { ...prev, [key]: cur - 1 };
      if (next[key] === 0) delete next[key];
      return next;
    });
  };

  const setCartQty = (product, qty, option) => {
    const key = cartKeyFor(product.id, option ? option.id : null);
    const stockQty = option ? (Number(option.stock_qty) || 0) : (product.stock_qty ?? 0);
    setCart(prev => {
      const next = { ...prev };
      const capped = Math.max(0, Math.min(qty, stockQty));
      if (capped <= 0) delete next[key];
      else next[key] = capped;
      return next;
    });
  };

  // จำนวนรวมของสินค้าชิ้นนี้ในตะกร้า (รวมทุกตัวเลือกเข้าด้วยกัน) — ใช้แสดงป้าย "ในตะกร้า" บนการ์ด
  const qtyForProduct = (productId) => {
    const prefix = String(productId);
    return Object.entries(cart).reduce((sum, [key, qty]) => {
      const pid = key.split("::")[0];
      return pid === prefix ? sum + qty : sum;
    }, 0);
  };

  const cartItems = useMemo(() => {
    return Object.entries(cart)
      .map(([key, qty]) => {
        if (qty <= 0) return null;
        const [productId, optionId] = key.split("::");
        const p = products.find(pr => String(pr.id) === productId);
        if (!p) return null;
        let price = Number(p.price) || 0;
        let stockQty = p.stock_qty ?? 0;
        let name = p.name;
        if (optionId) {
          const option = Array.isArray(p.options) ? p.options.find(o => String(o.id) === optionId) : null;
          if (!option) return null;
          price = Number(option.price) || 0;
          stockQty = Number(option.stock_qty) || 0;
          name = p.name + " - " + option.label;
        }
        return { id: key, key, name, price, qty, stock_qty: stockQty, product: p, optionId: optionId || null };
      })
      .filter(Boolean);
  }, [cart, products]);

  const totalQty = cartItems.reduce((s, it) => s + it.qty, 0);
  const totalPrice = cartItems.reduce((s, it) => s + it.qty * it.price, 0);
  const totalWeightG = cartItems.reduce((s, it) => s + ((Number(it.product.weight_g) || 0) * it.qty), 0);
  const shippingCost = computeShippingCost(shippingInfo.method, totalWeightG, shippingRates);
  const qrDataUrl = useMemo(
    () => cartItems.length > 0 ? promptPayQrDataUrl(totalPrice + shippingCost) : null,
    [cartItems.length, totalPrice, shippingCost]
  );

  const confirmOrder = () => {
    if (cartItems.length === 0) return;
    setModalOpen(true);
  };

  const handleOrderSent = () => {
    setCart({});
    setShippingInfo({ name: "", phone: "", address: "", note: "", method: "flash" });
  };

  return (
    <React.Fragment>
      <div className="topbar">
        <div className="topbar-inner">
          <div className="logo"><img src={LOGO_URI} alt="Phumjai" /></div>
          <div className="brand-block">
            <div className="brand-name">{SHOP_NAME}</div>
            <div className="brand-tag">BIOACTIVE · NATURE · LIFE</div>
          </div>
          <button className="cart-btn" onClick={() => setCartOpen(true)} aria-label="ตะกร้าสินค้า" title="ตะกร้าสินค้า">
            <IconCart />
            {totalQty > 0 && <span className="cart-badge">{totalQty}</span>}
          </button>
          <button className="help-btn" onClick={() => setShowHelp(v => !v)} aria-label="วิธีสั่งซื้อ" title="วิธีสั่งซื้อ">
            <IconHelp />
          </button>
        </div>
        {showHelp && (
          <div className="help-panel">
            <div className="help-panel-inner">
              <p>แตะที่สินค้าเพื่อเลือกตัวเลือก (ถ้ามี) และจำนวนแล้วกดเครื่องหมายถูกเพื่อใส่ตะกร้า จากนั้นกดไอคอนตะกร้ามุมขวาบน กรอกชื่อ-เบอร์โทร แล้วเลือกวิธีรับสินค้า (Flash Express / EMS / นัดรับสินค้าหน้าร้าน — ไม่มีค่าจัดส่ง) จะเห็นสรุปคำสั่งซื้อพร้อม QR PromptPay ให้สแกนจ่ายยอดที่ต้องโอน จากนั้นอัปโหลดรูปสลิปการโอนเงินแล้วกด "ส่งข้อมูลให้ร้าน" ระบบจะส่งข้อมูลการรับสินค้าและสลิปเข้าอีเมลร้านให้อัตโนมัติ ไม่ต้องแชทแจ้งร้านเองอีก</p>
              <button className="help-panel-close" onClick={() => setShowHelp(false)} aria-label="ปิด"><IconClose /></button>
            </div>
          </div>
        )}
      </div>

      <div className="container">
        {!loading && !error && featuredProducts.length > 0 && (
          <div className="featured">
            <div className="featured-head">แนะนำ</div>
            <div className="featured-row">
              {featuredProducts.map(p => (
                <div className="featured-item" key={p.id}>
                  <ProductCard
                    product={p}
                    qty={qtyForProduct(p.id)}
                    onOpen={setQuickAddProduct}
                  />
                </div>
              ))}
            </div>
          </div>
        )}

        {!loading && !error && mainCategories.length > 0 && (
          <div className="cat-nav">
            <div className="cat-row">
              {mainCategories.map(c => (
                <button key={c.id} className={"cat-chip" + (selectedMain && selectedMain.id === c.id ? " active" : "")} onClick={() => pickMain(c)}>{catLabel(c.name)}</button>
              ))}
            </div>
            {activeSubCategories.length > 0 && (
              <div className="cat-row cat-row-sub">
                {activeSubCategories.map(c => (
                  <button key={c.id} className={"cat-chip cat-chip-sub" + (selectedSub && selectedSub.id === c.id ? " active" : "")} onClick={() => setSelectedSub(c)}>{c.name}</button>
                ))}
              </div>
            )}
          </div>
        )}

        {loading && (
          <div className="state-box">
            <div className="spinner"></div>
            กำลังโหลดสินค้า...
          </div>
        )}

        {!loading && error && (
          <div className="state-box">
            <div className="big"><IconWarning /></div>
            {error}
          </div>
        )}

        {!loading && !error && products.length === 0 && (
          <div className="state-box">
            <img className="big-logo" src={LOGO_URI} alt="" />
            ยังไม่มีสินค้าในร้านขณะนี้
          </div>
        )}

        {!loading && !error && products.length > 0 && filteredProducts.length === 0 && (
          <div className="state-box">
            <img className="big-logo" src={LOGO_URI} alt="" />
            ไม่มีสินค้าในหมวดหมู่นี้
          </div>
        )}

        {!loading && !error && filteredProducts.length > 0 && (
          <div className="grid">
            {filteredProducts.map(p => (
              <ProductCard
                key={p.id}
                product={p}
                qty={qtyForProduct(p.id)}
                onOpen={setQuickAddProduct}
              />
            ))}
          </div>
        )}

        <div className="footer-note">© {new Date().getFullYear()} {SHOP_NAME} — ชำระผ่าน QR PromptPay แล้วอัปโหลดสลิป ระบบส่งคำสั่งซื้อให้ร้านทางอีเมลอัตโนมัติ</div>
      </div>

      {quickAddProduct && (
        <QuickAddModal
          key={quickAddProduct.id}
          product={quickAddProduct}
          cart={cart}
          onConfirm={setCartQty}
          onClose={() => setQuickAddProduct(null)}
        />
      )}

      {cartOpen && (
        <CartDrawer
          items={cartItems}
          total={totalPrice}
          onInc={(it) => incByKey(it.key, it.stock_qty)}
          onDec={(it) => decByKey(it.key)}
          onCheckout={() => { setCartOpen(false); setCheckoutOpen(true); }}
          onClose={() => setCartOpen(false)}
        />
      )}

      {checkoutOpen && (
        <CheckoutModal
          totalPrice={totalPrice}
          totalWeightG={totalWeightG}
          shippingRates={shippingRates}
          shippingInfo={shippingInfo}
          onChange={setShippingInfo}
          onClose={() => setCheckoutOpen(false)}
          onNext={() => { setCheckoutOpen(false); confirmOrder(); }}
        />
      )}

      {modalOpen && (
        <OrderModal
          items={cartItems}
          total={totalPrice}
          shippingInfo={shippingInfo}
          shippingCost={shippingCost}
          qrDataUrl={qrDataUrl}
          onClose={() => setModalOpen(false)}
          onSent={handleOrderSent}
        />
      )}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
